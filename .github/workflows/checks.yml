# Runs the API tests and the module checks (tests/modules.test.mjs) on every pull request and on main.
# `pull_request` (not `pull_request_target`): code from forks runs without secrets or write access.
name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
